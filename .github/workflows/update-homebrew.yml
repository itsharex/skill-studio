name: Update Homebrew tap

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tarnish233/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test updater
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify release asset and update Cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from update_skill_studio import update_cask, download_hash
          tag = os.environ['RELEASE_TAG']
          if not tag:
              raise SystemExit('release_tag is required')
          endpoint = f'tags/{tag}'
          release = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/tarnish233/skill-studio/releases/{endpoint}'], text=True))
          if release['draft'] or release['prerelease'] or (tag and release['tag_name'] != tag):
              raise SystemExit('Expected a published stable release')
          path = Path('Casks/skill-studio.rb')
          path.write_text(update_cask(path.read_text(), release, download_hash))
          PY
      - name: Validate and push update
        run: |
          ruby -c Casks/skill-studio.rb
          git diff --check
          if git diff --quiet -- Casks/skill-studio.rb; then
            echo "Cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/skill-studio.rb
          git commit -m "chore: update Skill Studio cask"
          git push origin HEAD:main
