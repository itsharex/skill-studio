name: Update Homebrew tap

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tarnish233/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test updater
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify release asset and update Cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_skill_studio.py
      - name: Validate and push update
        run: |
          ruby -c Casks/skill-studio.rb
          git diff --check
          if git diff --quiet -- Casks/skill-studio.rb; then
            echo "Cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/skill-studio.rb
          git commit -m "chore: update Skill Studio cask"
          git push origin HEAD:main
