name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 出 universal 包，一份同时支持 Apple Silicon 与 Intel
          - os: macos-latest
            label: macOS
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: ubuntu-22.04
            label: Linux
            args: "--bundles appimage,deb"
            rust-targets: ""
          - os: windows-latest
            label: Windows
            args: "--bundles msi,nsis"
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 各平台产物路径不同，统一捞到一个目录里
          find target -type f \
            \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \
               -o -name "*.msi" -o -name "*-setup.exe" \) \
            -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: skill-studio-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
