[workspace]
members  = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
edition      = "2021"
rust-version = "1.85.0"
version      = "0.1.0"
license      = "MIT"

[workspace.dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror  = "2.0"
anyhow     = "1.0"
dirs       = "5.0"
sha2       = "0.10"
log        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }
indexmap   = { version = "2", features = ["serde"] }
once_cell  = "1.21"
toml_edit  = "0.22"
tempfile   = "3"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = "s"
panic         = "unwind"
strip         = "symbols"
