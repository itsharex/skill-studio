<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Studio</title>
    <!-- 在样式加载前定好 dark class，避免深色模式下的白屏闪烁。
         改动此脚本必须同步更新 tauri.conf.json 里 CSP 的 sha256。 -->
    <script>(function(){try{var t=localStorage.getItem("skill-studio-theme")||"system";var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d);}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
